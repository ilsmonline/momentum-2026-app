<title id="title">Momentum 2026 lower level breakout room map</title>
<desc id="desc">Branded location map based on the Bank of Springfield Center lower-level diagram. B1 Derek Burgin, B2 Luke Keen at the top; B3 nursing and mother's room beneath B1; B4 Caleb Pellizzer, B6 Cohl Callies, B7 Joshua Hinzman on the left; B11A Izzy Marti, B11B Jaimee Jennings, B11C Todd and Shawndra Lucas, B11D Jacob Dilger on the right; B10 Called College with Grayson Wade at the bottom. Stairs near B3 and B8, restrooms at upper right and lower right.</desc>
